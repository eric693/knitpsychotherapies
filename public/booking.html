<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>線上預約｜織心心理治療所</title>
  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#0e7c7b">
  <style>
    .bk-wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 60px; }
    .bk-head { text-align: center; margin-bottom: 16px; }
    .bk-head h1 { font-size: 21px; margin: 0 0 4px; color: var(--primary); }
    .bk-head .sub { font-size: 13.5px; color: var(--muted); line-height: 1.7; }
    .bk-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .bk-card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    .bk-card h2 .step { background: var(--primary); color: #fff; border-radius: 50%; width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
    .bk-field { margin-bottom: 12px; }
    .bk-field label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 5px; }
    .bk-field .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
    .bk-field input, .bk-field select, .bk-field textarea { width: 100%; }
    .opt-list { display: flex; flex-direction: column; gap: 8px; }
    .opt { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
    .opt.on { border-color: var(--primary); background: var(--primary-light); }
    .opt .t { font-weight: 600; }
    .opt .d { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; background: #fff; }
    .chip.on { border-color: var(--primary); background: var(--primary); color: #fff; }
    .day-block { margin-bottom: 10px; }
    .day-block .d-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .day-block .full { font-size: 12.5px; color: #b8860b; }
    .bk-note { font-size: 12.5px; color: var(--muted); line-height: 1.8; white-space: pre-wrap; }
    .bk-submit { width: 100%; padding: 13px; font-size: 16px; }
    .bk-err { color: var(--danger); font-size: 13.5px; margin-top: 8px; min-height: 18px; }
    .done-box { text-align: center; padding: 26px 14px; }
    .done-box .ok { font-size: 40px; }
  </style>
</head>
<body style="background:var(--bg)">
  <div class="bk-wrap" id="app">載入中…</div>
  <div id="toast"></div>
  <script src="/js/ui.js"></script>
  <script src="/js/booking.js"></script>
</body>
</html>
